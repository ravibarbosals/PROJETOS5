# The whole app: database, migrations + first administrator, API, data pipeline,
# front and a local mail inbox. Runs without a .env (local defaults below); a
# .env in this folder overrides any of them.
#   docker compose up -d --wait   ->  http://localhost:8080
#   alert e-mails (DEC-037)       ->  http://localhost:8025
# The images come from Docker Hub; `--build` rebuilds them from the source.

x-database-url: &database-url postgresql://postgres:${POSTGRES_PASSWORD:-vigia-local}@db:5432/${POSTGRES_DB:-vigia}

# Validated on start by both the API and the migrations (env.validation.ts).
x-api-env: &api-env
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: *database-url
  # Local default only; set your own (32+ characters) in the .env.
  JWT_SECRET: ${JWT_SECRET:-segredo-local-do-compose-troque-em-producao}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
  ALERTA_INTERVALO_MINUTOS: ${ALERTA_INTERVALO_MINUTOS:-10}
  ALERTA_ESTABILIZACAO_HORAS: ${ALERTA_ESTABILIZACAO_HORAS:-2}
  ALERTA_EXPIRACAO_HORAS: ${ALERTA_EXPIRACAO_HORAS:-6}

services:
  # Own image (../dados/sql/Dockerfile): PostgreSQL 17 + the schema (DEC-016).
  db:
    build: ../dados/sql
    image: ravialmeida10/vigia-db:latest
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigia-local}
      POSTGRES_DB: ${POSTGRES_DB:-vigia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Applies the schema baked into the db image on every start, so an existing
  # volume also gets the tables added later (idempotent SQL).
  db-init:
    image: ravialmeida10/vigia-db:latest
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-vigia-local}
      # Hides the "already exists, skipping" notices of a re-run.
      PGOPTIONS: -c client_min_messages=warning
    command:
      - psql
      - -h
      - db
      - -U
      - postgres
      - -d
      - ${POSTGRES_DB:-vigia}
      - -v
      - ON_ERROR_STOP=1
      - -q
      - -f
      - /docker-entrypoint-initdb.d/10-schema.sql
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Pending migrations, then the first administrator (idempotent: does nothing
  # if one already exists). Same image as the API, compiled code.
  migrate:
    build: .
    image: ravialmeida10/vigia-api:latest
    environment:
      <<: *api-env
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@exemplo.gov.br}
      ADMIN_SENHA: ${ADMIN_SENHA:-vigia-admin}
    command:
      - sh
      - -c
      - >-
        node node_modules/typeorm/cli.js migration:run -d dist/infrastructure/database/data-source.js &&
        node dist/infrastructure/database/seed-admin.cli.js
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: ravialmeida10/vigia-api:latest
    environment:
      <<: *api-env
      DEMO_SENHA: ${DEMO_SENHA:-vigia-demo}
      # DEC-037: Mailpit by default; a real SMTP in the .env replaces it.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-O Vigia <alertas@vigia.local>}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  # Data pipeline scheduler (DEC-026): one collect + transform cycle on start,
  # then every INTERVALO_MINUTOS. Writes bronze and gold; the API only reads gold.
  dados:
    build: ../dados
    image: ravialmeida10/vigia-dados:latest
    environment:
      DATABASE_URL: *database-url
      INTERVALO_MINUTOS: ${INTERVALO_MINUTOS:-60}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  front:
    build: ../front
    image: ravialmeida10/vigia-front:latest
    ports:
      - "${FRONT_PORT:-8080}:80"
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to IPv6 first
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Catches every e-mail the API sends and shows it in a web inbox (DEC-037).
  # Nothing leaves the machine. Public image, used as is.
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  pg-data:
