# The whole app: database, migrations + first administrator, API and front.
#   docker compose up -d --build --wait   ->  http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-vigia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The app schema lives outside the migrations (DEC-016): same step as on Neon.
  db-init:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      - psql
      - -h
      - db
      - -U
      - postgres
      - -d
      - ${POSTGRES_DB:-vigia}
      - -v
      - ON_ERROR_STOP=1
      - -c
      - CREATE SCHEMA IF NOT EXISTS app
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Pending migrations, then the first administrator (idempotent: does nothing
  # if one already exists). Same image as the API, compiled code.
  migrate:
    build: .
    image: vigia-back
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vigia}
    command:
      - sh
      - -c
      - >-
        node node_modules/typeorm/cli.js migration:run -d dist/infrastructure/database/data-source.js &&
        node dist/infrastructure/database/seed-admin.cli.js
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    image: vigia-back
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vigia}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT:-3000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully

  front:
    build: ../front
    ports:
      - "${FRONT_PORT:-8080}:80"
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to IPv6 first
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg-data:
